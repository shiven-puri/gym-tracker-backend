version: '3.8'

services:
  # ==========================================
  # SERVICE 1: ORACLE DATABASE CONTAINER
  # ==========================================
  oracle-db:
    image: container-registry.oracle.com/database/free:latest
    container_name: oracle-db
    ports:
      - "1522:1521"
    environment:
      - ORACLE_PWD=shiven09
    restart: always

  # ==========================================
  # SERVICE 2: SPRING BOOT APPLICATION CONTAINER
  # ==========================================
  gym-tracker-app:
    build: .
    container_name: gym-tracker-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@//oracle-db:1521/FREEPDB1
      - SPRING_DATASOURCE_USERNAME=system
      - SPRING_DATASOURCE_PASSWORD=shiven09
    depends_on:
      - oracle-db
    restart: always