
services:
  gym-tracker-app:
    build: .
    container_name: gym-tracker-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      JWT_SECRET: ${JWT_SECRET:?secret in env file}
    volumes:
      - gym-tracker-data:/app/data
    restart: unless-stopped

volumes:
  gym-tracker-data:
