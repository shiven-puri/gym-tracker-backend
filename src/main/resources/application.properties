
spring.application.name=gym-tracker

# Database configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console disabled by default; enabled in application-local.properties
spring.h2.console.enabled=false

# JWT signing secret must be supplied through the environment
jwt.secret=${JWT_SECRET}

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Disable documentation endpoints in production by setting these to false
# via environment-specific configuration when appropriate
